<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soft Suave — Scalable AI & Automation</title>
<style>
  :root{
    --bg:#EBEEF0; --dark:#101418; --muted:#4b5563;
    --c1:#FF3D2E; --c2:#FF8A2B;
    --grad: linear-gradient(135deg,var(--c1),var(--c2));
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--dark); }
  html, body{ height:100%; }
  .page{ position:relative; overflow:hidden; height:100vh; display:flex; flex-direction:column; }
  .page::before{
    content:""; position:absolute; top:-10%; right:-8%; width:700px; height:700px;
    background:radial-gradient(circle,rgba(255,138,43,.14),rgba(255,61,46,.06) 45%,transparent 70%);
    filter:blur(10px); pointer-events:none;
  }

  /* nav */
  nav{
    position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
    padding:16px 56px; background:rgba(255,255,255,.55); backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%); border-bottom:1px solid rgba(255,255,255,.6);
    box-shadow:0 4px 24px rgba(16,20,24,.04);
  }
  nav img{ height:40px; }
  nav ul{ display:flex; gap:34px; list-style:none; }
  nav a{ text-decoration:none; color:var(--dark); font-size:15px; font-weight:500; display:flex; align-items:center; gap:6px; }
  nav .active{ color:var(--c1); background:rgba(255,255,255,.9); border-radius:8px; padding:6px 14px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--c1); }
  .caret{ border:4px solid transparent; border-top-color:#6b7280; border-bottom:0; }
  .nav-right{ display:flex; align-items:center; gap:18px; }
  .icon-btn{
    width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.75);
    display:flex; align-items:center; justify-content:center; color:var(--c1);
  }
  .btn{ background:var(--grad); color:#fff; border:none; border-radius:30px; font-weight:400; cursor:pointer; }
  .btn.nav-cta{ padding:12px 26px; font-size:15px; box-shadow:0 8px 20px rgba(255,61,46,.25); }

  /* hero */
  .hero{ display:flex; align-items:center; justify-content:space-between; gap:40px; padding:0 100px; flex-wrap:wrap; position:relative; z-index:1; flex:1; min-height:0; }
  .hero-copy{ max-width:640px; flex:1 1 480px; }
  .hero-copy h1{ font-size:64px; line-height:1.12; font-weight:500; letter-spacing:-.5px; }
  .hero-copy h1 b{ font-weight:800; }
  .grad-text{ background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .sml-text{ font-size: 40px; line-height: 1.0;}
  .hero-copy p{ margin-top:26px; font-size:18px; line-height:1.6; color:var(--muted); max-width:460px; }
  .consult{ margin-top:40px; display:inline-flex; align-items:center; gap:18px; padding:8px 8px 8px 26px; font-size:17px; box-shadow:0 12px 28px rgba(255,61,46,.28); }
  .consult .arrow{ background:#fff; color:var(--c1); width:38px; height:38px; border-radius:30px; display:flex; align-items:center; justify-content:center; }
  .hero-visual{ flex:1 1 420px; display:flex; justify-content:center; min-width:280px; height:100%; align-items:center; }
  .hero-visual img{ width:100%; max-width:560px; max-height:70vh; object-fit:contain; filter:drop-shadow(0 30px 40px rgba(16,20,24,.1)); }

  /* clients marquee */
  .clients{ padding:16px 56px 28px; position:relative; z-index:1; flex-shrink:0; }
  .clients-label{ font-size:13px; font-weight:700; border-top:1px solid rgba(16,20,24,.12); padding-top:14px; margin-bottom:18px; }
  .marquee{
    overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 64px,#000 calc(100% - 64px),transparent);
    mask-image:linear-gradient(90deg,transparent,#000 64px,#000 calc(100% - 64px),transparent);
  }
  .track{ display:flex; align-items:center; gap:64px; width:max-content; opacity:.65; filter:grayscale(100%); animation:scroll 18s linear infinite; }
  .marquee:hover .track{ animation-play-state:paused; }
  .track img{ height:30px; flex-shrink:0; }
  @keyframes scroll{ to{ transform:translateX(-50%); } }

  @media (max-width:900px){
    nav{ padding:14px 20px; }
    nav ul{ display:none; }
    .page{ height:auto; min-height:100vh; }
    .hero{ padding:40px 20px; }
    .hero-copy h1{ font-size:40px; }
    .clients{ padding:16px 20px 30px; }
  }

  @media (max-height:700px){
    .page{ height:auto; min-height:100vh; }
  }
</style>
</head>
